[workspace]
resolver = "2"
members = ["crates/lore-vm", "crates/lorevm-cli", "crates/lorevm-ffi", "src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/BiloxiStudios/loregui"
authors = ["Biloxi Studios Inc."]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "sync"] }
tracing = "0.1"

# Lore's own API library — pinned by exact rev. Pre-1.0, so any bump is a
# deliberate, manager-owned PR. SBAI-3685 / SBAI-3700 / SBAI-5434 / SBAI-5473 / SBAI-5488 / SBAI-5490.
# 826ad5d2 = authless user-info parity: exchange operations return typed
# NotSupported (code 18), and user-info operations forward that error unchanged.
# 9664606f5 (SBAI-5594) = lore-credential JWT `aud` root-domain check now also
# accepts the apex domain for leading-dot entries (strict widening, upstream
# bugfix); the other two commits in the gap are test-only.
# ba92f943 (SBAI-5910) = signed maintenance merge on the BiloxiStudios/lore
# fork (parents 9664606f5 + a6853ead): exact-domain JWT label boundary +
# legacy unscoped cached tokens fail closed (lore 0.8.6 backport, SBAI-5909).
# NOTE the HOST change: this rev exists only on BiloxiStudios/lore. Host and
# rev move together for BOTH deps; mixed-host or mixed-rev states are a
# fail-closed CI error (src-tauri/tests/lore_pin_contract.rs).
lore = { git = "https://github.com/BiloxiStudios/lore.git", rev = "ba92f94305df15796283755040c0bdd9b351841e" }

# REQUIRED: upstream `lore` patches quinn-proto to a vendored fork that adds
# `TransportErrorCode::is_crypto()`. A [patch] does NOT propagate through a git
# dependency, so without replicating it here `lore-transport` fails to compile
# ("no method named `is_crypto`"). Same fork, same exact commit, inside the
# lore repo. Every consumer of the `lore` crate needs this. SBAI-3685 / SBAI-5434 / SBAI-5473 / SBAI-5488 / SBAI-5490.
[patch.crates-io]
quinn-proto = { git = "https://github.com/BiloxiStudios/lore.git", rev = "ba92f94305df15796283755040c0bdd9b351841e" }
