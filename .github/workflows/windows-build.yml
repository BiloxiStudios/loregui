name: windows-build

# PR gate: proves the Windows installer still builds. Publishing to GitHub
# Releases (rolling `nightly` on main + versioned releases on tags, across
# Windows/Linux/macOS) is handled by release.yml — kept separate so nightly is
# managed in exactly one place.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: npm --prefix frontend ci || npm --prefix frontend install

      # SBAI-4069: `tauri.conf.json` declares `externalBin: ["binaries/loreserver"]`,
      # so `tauri build` REQUIRES a sidecar named with this target's triple to
      # exist. The real `loreserver` is a ~1 GB upstream build that we
      # deliberately do NOT run on the PR gate — release.yml builds + bundles the
      # genuine binary. Here, `src-tauri/build.rs` auto-stages a tiny placeholder
      # for the current triple so the bundler is satisfied and the gate keeps
      # proving the installer/config still builds. The placeholder is never
      # shipped; release.yml stages the real binary, which build.rs leaves intact.
      #
      # SBAI-4206: `tauri.conf.json` sets plugins.updater.pubkey +
      # bundle.createUpdaterArtifacts=true (SBAI-4040). When a pubkey is present
      # and updater artifacts are enabled, `tauri build` SIGNS those artifacts and
      # HARD-FAILS if TAURI_SIGNING_PRIVATE_KEY is unset — it does NOT silently
      # emit unsigned artifacts. This build-only gate intentionally carries no
      # signing secret, so we deep-merge `tauri.ci.conf.json` to flip
      # createUpdaterArtifacts off. The NSIS + MSI installers are unaffected
      # (updater artifacts are a separate output); release.yml still produces +
      # signs the real updater artifacts with the secret.
      - name: Build (Tauri → NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config src-tauri/tauri.ci.conf.json

      # SBAI-5560: gate bundles carry the build.rs PLACEHOLDER sidecar, not a
      # real loreserver — an artifact named like a release installer gets
      # installed by humans (EROS, 2026-07-21) and Host-a-server dies with
      # "Unsupported 16 Bit Application". Watermark the artifact name so the
      # channel is unmistakable; the upload stays as compile proof only.
      - name: Upload installer artifact (DEV — placeholder sidecar, not for install)
        uses: actions/upload-artifact@v4
        with:
          name: loregui-windows-dev-placeholder-sidecar
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn
