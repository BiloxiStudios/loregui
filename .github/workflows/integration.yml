name: integration

# Heavy runtime integration harness for lore-vm: drives the REAL in-process
# `lore` engine through the public lore-vm op bindings against temp repos. Two
# required steps run here, both gated behind the `integration-tests` feature:
#   1. integration_roundtrip — create → stage → commit → status → branch →
#      history happy path (in-memory mode).
#   2. e2e_lifecycle (SBAI-4060) — NON-SKIPPABLE full revision lifecycle
#      (add → update → delete → restore → revert + history audit) against a real
#      on-disk repo, plus a two-repo shared-store sync (CI-headless server↔client
#      stand-in).
#   3. exact-pin service CWD — builds the pinned `lore` CLI (product pin:
#      BiloxiStudios maintenance fork, SBAI-5910) and proves a
#      service in cwd A resolves a relative repository against caller root B.
#   4. exact-pin authless contract — boots a real authless server and proves the
#      public C ABI returns 18 (not 12) plus the Rust wrapper preserves the wire.
# Kept SEPARATE from the fast `ci.yml` so it never blocks normal op PRs — `ci.yml`
# runs only the fast unit tests (`cargo test -p lore-vm`, no feature).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/lore-vm/**"
      - "crates/lorevm-cli/**"
      - "crates/lorevm-ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/exact-pin-service-cwd-canary.sh"
      - "scripts/exact-pin-service-cwd-canary.test.sh"
      - "scripts/exact-pin-authless-contract.mjs"
      - "scripts/exact-pin-authless-contract.test.mjs"
      # SBAI-5910: the pin-policy + parity-mutation contracts and the workflow
      # they guard must retrigger this job, or the Rule-40 fixtures would be
      # local-only while the guarded file changed freely.
      - "scripts/lore-pin-policy.mjs"
      - "scripts/lore-pin-policy.test.mjs"
      - "scripts/workflow-canonical-policy.mjs"
      - "scripts/workflow-canonical-policy.test.mjs"
      - "scripts/upstream-parity.canonical.yml"
      - "scripts/lock-delta-contract.test.mjs"
      - ".github/workflows/upstream-parity.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/live-server-client.sh"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && 'ubuntu-latest' || fromJSON(vars.LOREGUI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SBAI-5910: the lock-delta contract diffs against the base commit,
          # so it needs history — a shallow checkout would make that step
          # error rather than verify.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps for lore build
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Integration roundtrip against a real in-process lore instance
        run: cargo test -p lore-vm --features integration-tests --test integration_roundtrip
      # NON-SKIPPABLE end-to-end revision-lifecycle gate (SBAI-4060). Drives the
      # full add → update → delete → restore → revert lifecycle plus a final
      # history audit against a REAL on-disk repo, and a two-repo shared-store
      # sync (the CI-headless server↔client stand-in). A regression here fails
      # the job — no continue-on-error, no `|| true`.
      - name: E2E revision lifecycle against a real on-disk lore instance
        run: cargo test -p lore-vm --features integration-tests --test e2e_lifecycle
      - name: Exact-pin service fixture fails closed on missing or wrong binary
        run: scripts/exact-pin-service-cwd-canary.test.sh
      - name: Exact-pin service resolves relative repository against caller root
        run: scripts/exact-pin-service-cwd-canary.sh
      - name: Exact-pin authless negative fixtures fail closed
        run: node --test scripts/exact-pin-authless-contract.test.mjs

      # SBAI-5910: the product pin is the BiloxiStudios maintenance fork;
      # these prove the pin policy STOPS on unknown/empty/mixed pins and that
      # the parity workflow cannot mutate the pin or open a bump PR.
      - name: Lore pin policy fails closed on unknown, empty, and mixed pins
        run: node --test scripts/lore-pin-policy.test.mjs

      # SBAI-5910: the parity workflow is pinned to a reviewed canonical form.
      # Two hand-written parsers were defeated by valid YAML (quoted keys,
      # quoted/commented values, folded >- bodies), so there is no parse
      # surface left — any alternate spelling changes the bytes and fails.
      - name: Upstream-parity workflow matches its canonical form
        run: node --test scripts/workflow-canonical-policy.test.mjs

      # Enforces the minimal lock shape against the base commit: exactly 13
      # source repins + one direct edge, zero registry/resolver churn.
      - name: Lock delta contract (minimal repin shape)
        run: node --test scripts/lock-delta-contract.test.mjs
      # REQUIRED and non-skippable: real authless loreserver + public C ABI +
      # LoreGUI Rust wrapper. Any missing/wrong pin or status/wire drift fails.
      - name: Exact-pin authless C-ABI and Rust wire contract
        run: scripts/live-server-client.sh
