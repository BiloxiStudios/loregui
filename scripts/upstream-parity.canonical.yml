name: upstream-parity

# Keep LoreGUI in parity with Epic's `lore`. On a schedule (and on demand), this
# fetches the LATEST upstream `lore` source and diffs its op surface against our
# `crates/lore-vm/src/ops` bindings.
#
# Extensions (SBAI-4070):
#   1. Detect and REPORT upstream lore drift. (SBAI-5910: proposing/bumping
#      via PR is DISABLED — the product pin is the BiloxiStudios maintenance
#      fork, which carries credential hardening absent upstream.)
#   2. Detect signature drift (breaking changes) on bound ops.
#   3. Auto-dispatch SBAI tickets per new/changed op.
#   4. Canary E2E job against the CURRENT product pin (never an unreviewed
#      upstream rev — a green canary must not read as clearance to bump).
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/upstream-lore-distance.mjs"
      - "scripts/upstream-lore-distance.test.mjs"
      - "scripts/upstream-lore-parity.mjs"
      - ".github/workflows/upstream-parity.yml"

# SBAI-5910: mutation is disabled, so the token is least-privilege. `contents`
# stays READ (checkout only — no bump commit/branch push) and `pull-requests`
# is dropped entirely (no automated bump PR). `issues: write` remains for the
# BrainMon ticket dispatch, which is reporting, not mutation.
permissions:
  contents: read

jobs:
  watcher-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify independent product and watcher distances
        run: node scripts/upstream-lore-distance.test.mjs

  detect:
    # SBAI-5910: reporting scope lives ONLY here (BrainMon ticket dispatch);
    # the canary job inherits the workflow default of contents: read.
    permissions:
      contents: read
      issues: write
    runs-on: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && 'ubuntu-latest' || fromJSON(vars.LOREGUI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    outputs:
      rev_changed: ${{ steps.check.outputs.changed }}
      old_rev: ${{ steps.pinned.outputs.rev }}
      new_rev: ${{ steps.upstream.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable

      - name: Restore previous watcher checkpoint
        id: checkpoint-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lore-parity-checkpoint
          key: ${{ runner.os }}-lore-parity-checkpoint-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-lore-parity-checkpoint-

      - name: Read previous watcher checkpoint
        id: checkpoint
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          CHECKPOINT_FILE="${RUNNER_TEMP}/lore-parity-checkpoint/revision"
          if [[ -f "$CHECKPOINT_FILE" ]]; then
            echo "sha=$(<"$CHECKPOINT_FILE")" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert the accepted product pin (fail closed)
        id: pinned
        run: |
          set -euo pipefail
          # SBAI-5910: ONE policy, shared with scripts/lore-pin-policy.test.mjs.
          # Exact accepted product pin only — empty, unknown host (including
          # any "some other fork"), unknown rev, mixed, or unparseable STOPS.
          # A previous version treated every non-Epic host as "a maintenance
          # fork" and continued, so an arbitrary host passed.
          node scripts/lore-pin-policy.mjs Cargo.toml
          # The workflow gates on the SAME structural policy its fixtures
          # drive, so this file cannot drift from the guard that protects it.
          node scripts/workflow-canonical-policy.mjs .github/workflows/upstream-parity.yml
          REV=$(node -e 'import("./scripts/lore-pin-policy.mjs").then(m=>process.stdout.write(m.ACCEPTED_REV))')
          echo "rev=$REV" >> $GITHUB_OUTPUT

      - name: Fetch latest upstream lore
        id: upstream
        run: |
          git clone --filter=blob:none https://github.com/EpicGames/lore.git /tmp/lore-head
          SHA=$(git -C /tmp/lore-head rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Check out the shipped product pin
        run: |
          git -C /tmp/lore-head worktree add --detach /tmp/lore-pinned "${{ steps.pinned.outputs.rev }}"

      - name: Check for rev change
        id: check
        run: |
          if [ "${{ steps.pinned.outputs.rev }}" != "${{ steps.upstream.outputs.sha }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run parity check (with drift detection)
        id: parity
        run: |
          ARGS=(
            --head-src /tmp/lore-head/lore/src
            --head-git /tmp/lore-head
            --head-sha "${{ steps.upstream.outputs.sha }}"
          )
          if [[ -n "${{ steps.checkpoint.outputs.sha }}" ]]; then
            ARGS+=(--checkpoint "${{ steps.checkpoint.outputs.sha }}")
          fi

          node scripts/upstream-lore-distance.test.mjs
          LORE_SRC=/tmp/lore-pinned node scripts/upstream-lore-parity.mjs "${ARGS[@]}" --json > /tmp/parity.json
          # Show summary in logs
          LORE_SRC=/tmp/lore-pinned node scripts/upstream-lore-parity.mjs "${ARGS[@]}"

      - name: Save watcher checkpoint
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/lore-parity-checkpoint"
          printf '%s\n' "${{ steps.upstream.outputs.sha }}" > "${RUNNER_TEMP}/lore-parity-checkpoint/revision"

      - name: Persist watcher checkpoint
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/lore-parity-checkpoint
          key: ${{ runner.os }}-lore-parity-checkpoint-${{ github.run_id }}

      # SBAI-5910 (binding ruling, sb-lore + sb-fable): PRODUCT SOURCE is the
      # BiloxiStudios maintenance fork at the reviewed pin; EpicGames upstream
      # is a DRIFT TARGET ONLY. Observation and reporting continue; MUTATION
      # FAILS CLOSED. The former auto-PR path rewrote the pin and opened a PR
      # against upstream HEAD, which would silently drop the fork-only
      # credential hardening (SBAI-5909) that has no upstream equivalent yet.
      # Automation may return only when BOTH hold: (a) EpicGames upstream
      # itself carries the empty-root fail-closed fix, and (b) a reviewed
      # target preserves the consumer DENY guard (SBAI-5905 / SBAI-5916).
      # Direct fork-to-Epic repin is prohibited. SBAI-5919 is trusted-IdP
      # restoration, a different gate.
      - name: Report rev drift (mutation disabled)
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          SHA=${{ steps.upstream.outputs.sha }}
          echo "::notice::upstream lore HEAD is ${SHA:0:12}; the product pin stays on the reviewed maintenance-fork rev."
          echo "Auto-bump is DISABLED (SBAI-5910): bumping to upstream HEAD would drop the fork-only credential hardening."
          echo "Parity moves go through a reviewed repin ticket that must preserve the consumer DENY guard (repin/consumer-guard gates: SBAI-5905 / SBAI-5916; trusted-IdP restoration is SBAI-5919)."
          echo "Un-gating the Epic repin path additionally requires that EpicGames upstream ITSELF carries the empty-root fail-closed fix (legacy unscoped cached tokens denied); until upstream carries it, repinning to Epic regresses the credential boundary regardless of consumer guards."

      - name: Dispatch BrainMon tickets
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/parity.json","utf8"));
            const { execSync } = require("child_process");
            
            // Map domains to their primary Story keys for parent-linkage hint
            const DOMAIN_STORIES = {
              repository: "SBAI-4033",
              file: "SBAI-4034",
              revision: "SBAI-4036",
              storage: "SBAI-4024",
              auth: "SBAI-3841",
            };

            for (const op of r.newOps) {
              const [domain] = op.id.split(".");
              const title = `[Parity] Build op ${op.id}`;
              const story = DOMAIN_STORIES[domain] || "SBAI-4024";
              const body = `Upstream lore added op \`${op.id}\` (args: \`${op.sig.argsType}\`). Build binding -> command -> palette entry.\n\nParent Story: ${story}`;
              
              const existing = execSync(`gh issue list --search "${title}" --label upstream-parity --json number --jq ".[0].number"`, { encoding: "utf8" }).trim();
              if (!existing) {
                console.log(`Creating ticket for new op: ${op.id}`);
                execSync(`gh issue create --title "${title}" --body "${body}" --label upstream-parity --label "${domain}"`);
              }
            }

            for (const op of r.driftedOps) {
              const [domain] = op.id.split(".");
              const title = `[Parity] FIX signature drift in ${op.id}`;
              const body = `Upstream lore changed signature of \`${op.id}\`.\n\nUpdate lore-vm binding to match upstream changes.`;
              
              const existing = execSync(`gh issue list --search "${title}" --label upstream-parity --json number --jq ".[0].number"`, { encoding: "utf8" }).trim();
              if (!existing) {
                console.log(`Creating ticket for drifted op: ${op.id}`);
                execSync(`gh issue create --title "${title}" --body "${body}" --label upstream-parity --label drift --label "${domain}"`);
              }
            }
          '

  canary:
    needs: detect
    if: needs.detect.outputs.rev_changed == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && 'ubuntu-latest' || fromJSON(vars.LOREGUI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps for lore build
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      # SBAI-5910: the canary no longer rewrites the pin (same ruling — no
      # mutation while fork-only hardening is absent upstream). It exercises
      # the CURRENT product pin so a green canary can never be read as
      # clearance for an unreviewed upstream rev.
      # The exact-pin caller-CWD proof needs a `lore` CLI built from the pinned
      # rev. The blanket `cargo test` never provisioned one, so that test
      # aborted the canary the moment this job actually ran (it is gated on
      # rev_changed, so the breakage sat latent). integration.yml proves it via
      # this dedicated script; the canary now uses the SAME provisioning, so
      # the proof really runs against the pin under test instead of being
      # skipped to get green.
      - name: Exact-pin caller-CWD proof against the pinned rev
        run: scripts/exact-pin-service-cwd-canary.sh
      - name: Run integration tests (canary)
        # That one test is executed by the step above with its binary
        # provisioned; running it again here without LOREVM_LORE_BIN would
        # fail on the missing binary, not on a real regression.
        run: |
          cargo test -p lore-vm --features integration-tests --locked --             --skip unix_service_resolves_relative_repository_against_caller_root
